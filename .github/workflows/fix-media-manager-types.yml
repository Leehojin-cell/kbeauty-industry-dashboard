name: Fix MediaManager style typing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add const assertion to MediaManager styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/MediaManager.tsx')
          text = p.read_text()
          marker = 'const s = {'
          start = text.find(marker)
          end_marker = '\n};\n\nexport default'
          end = text.find(end_marker, start)
          if start >= 0 and end >= 0 and '} as const;' not in text[start:end]:
              text = text[:end] + '\n} as const;' + text[end + len('\n};'):]
              p.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git add app/dashboard/MediaManager.tsx
          git commit -m "fix: preserve MediaManager style literal types"
          git push
