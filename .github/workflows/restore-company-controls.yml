name: Restore company table controls

on:
  push:
    branches:
      - fix/restore-company-controls-final

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'restore company table controls [generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch dashboard controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/dashboard/InteractiveDashboard.tsx')
          text = p.read_text(encoding='utf-8')

          old_state = ''' const [companies,setCompanies]=useState<Company[]>(seed),[search,setSearch]=useState(''),[selectedBySector,setSelectedBySector]=useState<Record<Sector,string[]>>({'브랜드사':[],'ODM(색조)':[],'ODM(기초)':[],'플랫폼·유통':[]}),[selectedAllIds,setSelectedAllIds]=useState<string[]>([]),[selected,setSelected]=useState<Company|null>(null),[message,setMessage]=useState(''),[year,setYear]=useState('2024–2026년'),[category,setCategory]=useState('전체 카테고리'),[companyFilter,setCompanyFilter]=useState('기업 선택');'''
          new_state = ''' const [companies,setCompanies]=useState<Company[]>(seed),[search,setSearch]=useState(''),[selectedBySector,setSelectedBySector]=useState<Record<Sector,string[]>>({'브랜드사':[],'ODM(색조)':[],'ODM(기초)':[],'플랫폼·유통':[]}),[selectedAllIds,setSelectedAllIds]=useState<string[]>([]),[selected,setSelected]=useState<Company|null>(null),[message,setMessage]=useState(''),[year,setYear]=useState('2024–2026년'),[category,setCategory]=useState('전체 카테고리'),[companyFilter,setCompanyFilter]=useState('기업 선택'),[expandedBySector,setExpandedBySector]=useState<Record<Sector,boolean>>({'브랜드사':false,'ODM(색조)':false,'ODM(기초)':false,'플랫폼·유통':false}),[sortBySector,setSortBySector]=useState<Record<Sector,number>>({'브랜드사':0,'ODM(색조)':0,'ODM(기초)':0,'플랫폼·유통':0}),[expandedAll,setExpandedAll]=useState(false),[globalSort,setGlobalSort]=useState(0);'''
          if old_state not in text:
              raise SystemExit('state marker not found')
          text = text.replace(old_state, new_state, 1)

          marker = ' const renderSector=(s:Sector)=>{'
          start = text.index(marker)
          end = text.index('\n return <main', start)
          new_render = r''' const renderSector=(s:Sector)=>{const rows=sectorRows(companies,s),ids=selectedBySector[s],allChecked=rows.length>0&&rows.every(c=>ids.includes(c.id)),sortMode=sortBySector[s];const sortedRows=[...rows].sort((a,b)=>sortMode===1?b.revenue2025-a.revenue2025:sortMode===2?growth(b)-growth(a):sortMode===3?a.company.localeCompare(b.company,'ko'):0),visibleRows=expandedBySector[s]?sortedRows:sortedRows.slice(0,5),sortLabel=['순서 정렬','매출순','성장률순','가나다순'][sortMode];return <Card className="sectorCard"><div className="sectionHead"><div><h2>{s}</h2><span>{ids.length?`선택된 ${ids.length}개`:''}</span></div><div className="sectorTools"><button className="tableTool" onClick={()=>setExpandedBySector(v=>({...v,[s]:!v[s]}))}>{expandedBySector[s]?'접기':'전체 보기'}</button><button className="tableTool" onClick={()=>setSortBySector(v=>({...v,[s]:(v[s]+1)%4}))}>{sortLabel}</button><button className="addCompany">+ 기업 추가</button></div></div><div className="bulkbar"><label><input type="checkbox" checked={allChecked} onChange={()=>toggleAll(s)}/> 전체 선택</label><span>선택됨 {ids.length}개</span><button className="deleteBtn" disabled={!ids.length||!isAdmin} onClick={()=>void deleteCompanies(ids)}>선택 삭제</button></div><div className="table compact"><div className="tr th"><span>선택</span><span>기업명</span><span>2025 별도(억원)</span><span>성장률</span><span>삭제</span></div>{visibleRows.map(c=><div className="tr clickable" key={c.id} onClick={()=>setSelected(c)}><span onClick={e=>e.stopPropagation()}><input type="checkbox" checked={ids.includes(c.id)} onChange={()=>toggle(s,c.id)}/></span><strong>{c.company}</strong><span>{money(c.revenue2025)}</span><span className={growth(c)>=0?'up':'down'}>{growth(c)>=0?'+':''}{growth(c).toFixed(1)}%</span><button className="rowDelete" disabled={!isAdmin} onClick={e=>{e.stopPropagation();void deleteCompanies([c.id])}}>♙</button></div>)}</div></Card>}'''
          text = text[:start] + new_render + text[end:]

          old_global = '''<Card className="all"><div className="sectionHead"><div><h2>K-뷰티 기업 전체 데이터</h2><span>총 {all.length}개 기업</span></div><div className="globalTools"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="기업 검색..."/><button className="addCompany">+ 기업 추가</button><button>전체 보기</button></div></div><div className="globalBulk">'''
          new_global = '''<Card className="all"><div className="sectionHead"><div><h2>K-뷰티 기업 전체 데이터</h2><span>총 {all.length}개 기업</span></div><div className="globalTools"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="기업 검색..."/><button className="addCompany">+ 기업 추가</button><button className="tableTool" onClick={()=>setExpandedAll(v=>!v)}>{expandedAll?'접기':'전체 보기'}</button><button className="tableTool" onClick={()=>setGlobalSort(v=>(v+1)%4}>{['순서 정렬','매출순','성장률순','가나다순'][globalSort]}</button></div></div><div className="globalBulk">'''
          if old_global not in text:
              raise SystemExit('global header marker not found')
          text = text.replace(old_global, new_global, 1)

          old_rows = '''</div><div className="table"><div className="tr allTh"><span>선택</span><span>순서</span><span>기업명</span><span>카테고리</span><span>2025 별도(억원)</span><span>2025 연결(억원)</span><span>성장률</span><span>삭제</span></div>{all.slice(0,10).map((c,i)=>'''
          new_rows = '''</div><div className="table"><div className="tr allTh"><span>선택</span><span>순서</span><span>기업명</span><span>카테고리</span><span>2025 별도(억원)</span><span>2025 연결(억원)</span><span>성장률</span><span>삭제</span></div>{(expandedAll?[...all].sort((a,b)=>globalSort===1?b.revenue2025-a.revenue2025:globalSort===2?growth(b)-growth(a):globalSort===3?a.company.localeCompare(b.company,'ko'):0):[...all].sort((a,b)=>globalSort===1?b.revenue2025-a.revenue2025:globalSort===2?growth(b)-growth(a):globalSort===3?a.company.localeCompare(b.company,'ko'):0).slice(0,10)).map((c,i)=>'''
          if old_rows not in text:
              raise SystemExit('global rows marker not found')
          text = text.replace(old_rows, new_rows, 1)

          old_css = '.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}.sectionHead>div{display:flex;align-items:center;gap:7px}'
          new_css = '.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}.sectionHead>div{display:flex;align-items:center;gap:7px}.sectorTools{display:flex;align-items:center;gap:4px}.tableTool{border:1px solid #d8e0ec;background:#fff;color:#173866;border-radius:5px;padding:5px 7px;font-size:8px;font-weight:700;cursor:pointer}.tableTool:hover{background:#f1f6ff}'
          if old_css not in text:
              raise SystemExit('css marker not found')
          text = text.replace(old_css, new_css, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/InteractiveDashboard.tsx
          git commit -m 'restore company table controls [generated]' || exit 0
          git push origin HEAD:fix/restore-company-controls-final
