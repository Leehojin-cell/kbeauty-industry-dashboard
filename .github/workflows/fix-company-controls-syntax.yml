name: Fix company controls syntax
on:
  push:
    branches:
      - fix/restore-company-controls-final
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'company controls syntax [generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix syntax and remove helper workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/InteractiveDashboard.tsx')
          s=p.read_text(encoding='utf-8')
          old="onClick={()=>setGlobalSort(v=>(v+1)%4}"
          new="onClick={()=>setGlobalSort(v=>(v+1)%4)}"
          if old not in s:
              raise SystemExit('syntax marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .github/workflows/fix-company-controls-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/InteractiveDashboard.tsx .github/workflows/fix-company-controls-syntax.yml
          git commit -m 'fix company controls syntax [generated]'
          git push origin HEAD:fix/restore-company-controls-final
